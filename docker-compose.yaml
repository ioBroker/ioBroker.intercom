version: '3.9'

services:
    asterisk:
        # A plain Ubuntu: start.sh (generated by the adapter into the configuration directory) installs
        # Asterisk 20 with PJSIP, the WSS transport and res_srtp on the first start of the container.
        # Official image for amd64 and arm64 (Raspberry Pi), no third party image involved.
        image: ubuntu:24.04
        labels:
            - 'iobEnabled=${config.dockerEnabled:-false}'
            - 'iobStopOnUnload=${config.dockerStopOnUnload:-false}'
            # an image update recreates the container and Asterisk would be installed again
            - 'iobAutoImageUpdate=false'
            # restart the container if Asterisk exits unexpectedly
            - 'iobMonitoringEnabled=true'
            # the adapter writes the configuration files first and then lets the container start
            - 'iobWaitForReady=true'
        entrypoint: ['/bin/bash', '/etc/asterisk/iobroker/start.sh']
        # WebRTC needs the RTP port range (UDP 10000-20000) and correct ICE candidates:
        # host networking avoids publishing 10000 ports and NAT between the clients and Asterisk
        network_mode: host
        volumes:
            # No iobBackup: everything in it is generated from the instance settings, which an ioBroker backup contains
            - '${config.configDir}:/etc/asterisk/iobroker:ro'
            # log file of Asterisk, read by the adapter and forwarded to the ioBroker log
            - '${config.configDir}/logs:/var/log/asterisk'
        restart: unless-stopped
