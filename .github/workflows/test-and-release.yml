name: Test and Release

on:
    push:
        branches:
            - '*'
        tags:
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  # src-www (the phone of the test page) has its own dependencies
                  install-command: 'npm run npm'
                  type-checking: true
                  lint: true

    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: [check-and-lint]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install Dependencies
              run: npm run npm
            - name: Build, unit and package tests
              run: npm test
            - name: Integration test (starts without Asterisk)
              run: npm run test:integration

    deploy:
        needs: [adapter-tests]
        permissions:
            contents: write
            id-token: write
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  install-command: 'npm run npm'
                  build: true
                  node-version: '24.x'
                  github-token: ${{ secrets.GITHUB_TOKEN }}
